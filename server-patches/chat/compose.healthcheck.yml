# Install healthcheck.sh beside this file; merge with the existing Compose file.
services:
  openim-chat:
    volumes:
      - ./healthcheck.sh:/usr/local/bin/chat-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/chat-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
