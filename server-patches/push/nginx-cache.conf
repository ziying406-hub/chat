# Include inside the web server block, BEFORE the generic static-file regex.
# Mutable worker/config names must not receive a month of immutable CDN caching.
location ~ ^/(sw\.js|firebase-messaging-sw\.js|firebase-config\.js|firebase-sdk/.*\.js)$ {
    expires off;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
