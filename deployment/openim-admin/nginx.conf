server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location / { try_files $uri $uri/ /index.html; }
    location /complete_admin/ {
        proxy_pass http://openim-chat:10009/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { proxy_pass http://openim-server:10002/; }
    location /chat/ {
        # Admin business pages also use /chat; GET serves the SPA, POST reaches Chat API.
        if ($request_method = GET) { rewrite ^ /index.html last; }
        proxy_pass http://openim-chat:10008/;
    }
}
